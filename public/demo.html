 an editorial correction notice."}, "CS-015": {"classification": "supported", "priority": "low", "quote": "12,000 visits and 240 signups, yielding a 2% signup rate."}, "CS-016": {"classification": "supported", "priority": "low", "quote": "Product feature article is paid content"}, "CS-017": {"classification": "supported", "priority": "low", "quote": "visitors from Region A must complete the digital arrival form before departure."}, "CS-018": {"classification": "contradicted", "priority": "high", "quote": "form Q-14 is retired. All new applications must use form Q-18."}, "CS-019": {"classification": "supported", "priority": "low", "quote": "The comparative study enrolled adults only."}, "CS-020": {"classification": "supported", "priority": "low", "quote": "requires a visible sponsorship label."}}}</script>
<script>
'use strict';
const DATA=JSON.parse(document.querySelector('#dataset').textContent), CASES=DATA.cases, SOURCES=DATA.sources, UPDATES=DATA.updates, POLICIES=DATA.policies, PRED=DATA.predictions;
const getSource=(id)=>SOURCES.find(x=>x.id===id), getCase=(id)=>CASES.find(x=>x.id===id), getUpdate=(id)=>UPDATES.find(x=>x.id===id);
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nice=x=>String(x).replaceAll('_',' ').replace(/\b\w/g,c=>c.toUpperCase());
const chip=(s,t='')=>`<span class="chip ${t}">${esc(nice(s))}</span>`;
const getPred=c=>PRED[c.id],goldPred=c=>({classification:c.gold,priority:c.goldPriority});
const classifyTone=x=>({supported:'green',contradicted:'red',insufficient_evidence:'amber',policy_issue:'violet'}[x]||'muted');
const risky=p=>p==='high'||p==='critical';
let state={tab:'overview',sector:'All',selected:'CS-001',update:UPDATES[0].id,benchmark:'baseline',query:'',decisions:{},impactDecisions:{},local:[],customMessage:''};
try{state.decisions=JSON.parse(localStorage.getItem('cs-decisions')||'{}')}catch{}
const tabs=[['overview','Overview',''],['review','Review desk',CASES.length],['impact','Impact map',UPDATES.length],['evaluation','Evaluation lab',''],['policies','Policy library',POLICIES.length]];
function navigate(tab){state.tab=tab;render();window.scrollTo(0,0)}
function renderNav(){$('#nav').innerHTML=tabs.map(([id,label,num])=>`<button type="button" data-nav="${id}" class="${state.tab===id?'active':''}">${label}${num?`<span class="num">${num}</span>`:''}</button>`).join('');$('#crumb').textContent='Workspace / '+tabs.find(x=>x[0]===state.tab)[1]}
function title(eyebrow,t,description){return `<div class="eyebrow">${eyebrow}</div><h1>${esc(t)}</h1><p class="intro">${esc(description)}</p>`}
function renderOverview(){let score=scoreDataset(CASES.map(c=>({case:c,pred:getPred(c)})));return `${title('Editorial intelligence / portfolio prototype','Accuracy at portfolio scale.','Trace claims to evidence, surface source changes, and test evaluation reliability before human editors make decisions.')}<div class="notice"><b>Prototype:</b> All content, publishers, reference documents, and policies are fictional. No AI API requests are made from this offline demonstration. The baseline uses prewritten classifications—not measured model predictions.</div><div class="stats"><div class="stat"><label>Editorial cases</label><strong>${CASES.length}</strong><small>Across four verticals</small></div><div class="stat"><label>Reference changes</label><strong>${UPDATES.length}</strong><small>Versioned document updates</small></div><div class="stat"><label>Review decisions</label><strong>${Object.keys(state.decisions).length}</strong><small>Local browser only</small></div><div class="stat"><label>Baseline label agreement</label><strong>${score.pct}%</strong><small>Authored demo baseline</small></div></div><div class="sectors">${['Health','Legal','Travel','Media'].map(s=>`<button class="sectorcard" data-open-sector="${s}"><b>${s} →</b><strong>${CASES.filter(c=>c.sector===s).length} cases</strong><small>Inspect fictional article reviews</small></button>`).join('')}</div><div class="two"><section class="panel"><div class="paneltitle"><div><h2>Editorial review</h2><p>Claims, sources, policy rules, decisions</p></div>${chip('Workflow 01')}</div><p>Evaluate supplied claims against sources and distinguish verified evidence from an unsupported assumption.</p><div style="margin-top:20px"><button class="btn primary" data-nav="review">Open review desk →</button></div></section><section class="panel"><div class="paneltitle"><div><h2>Cross-portfolio impact</h2><p>How new information affects existing publications</p></div>${chip('Workflow 02')}</div><p>Discover source-linked articles and weaker keyword candidates when reference documents change.</p><div style="margin-top:20px"><button class="btn primary" data-nav="impact">Open impact map →</button></div></section></div><div class="footnote">Independent applicant portfolio demo · Not affiliated with Internet Brands or its properties.</div>`}
function filterCases(){return CASES.filter(c=>(state.sector==='All'||state.sector===c.sector)&&(`${c.title} ${c.content} ${c.id} ${c.property}`).toLowerCase().includes(state.query.toLowerCase()))}
function renderReview(){const selected=getCase(state.selected)||CASES[0],s=getSource(selected.sourceId),p=getPred(selected), policies=POLICIES.filter(x=>x.sector==='All'||x.sector===selected.sector), filtered=filterCases(),decision=state.decisions[selected.id];return `${title('Workflow 01 / source-grounded review','Editorial review desk','Inspect article claims alongside fictional source material and policy rules. An editor—not AI—makes the final decision.')}<div class="columns"><section class="panel"><div class="paneltitle"><div><h2>Incoming queue</h2><p>${filtered.length} of ${CASES.length} cases</p></div>${chip('Review')}</div><input class="input" id="caseSearch" value="${esc(state.query)}" placeholder="Search cases ..." aria-label="Search cases"><div class="filterrow">${['All','Health','Legal','Travel','Media'].map(x=>`<button data-sector="${x}" class="${state.sector===x?'on':''}">${x}</button>`).join('')}</div><div class="queue">${filtered.map(c=>`<button class="listitem ${selected.id===c.id?'selected':''}" data-case="${c.id}">${chip(c.sector,'muted')} <span>${c.id}</span><strong>${esc(c.title)}</strong><span>${esc(c.content.slice(0,130))}</span>${state.decisions[c.id]?' '+chip('Reviewed','green'):''}</button>`).join('')||'<div class="empty">No results</div>'}</div></section><section class="panel"><div class="paneltitle"><div><div class="eyebrow">${selected.id} · ${esc(selected.sector)} · ${esc(selected.intake)}</div><h2>${esc(selected.title)}</h2><p>${esc(selected.property)} · Owner: ${esc(selected.owner)}</p></div>${chip(p.priority,risky(p.priority)?'red':p.priority==='medium'?'amber':'muted')}</div><div class="compare"><div><h3>Article claim</h3><div class="quote">${esc(selected.content)}</div></div><div><h3>Provided source · ${esc(s.id)}</h3><div class="quote">${esc(s.excerpt)}</div><div class="small">Version ${esc(s.version)} · ${esc(s.issuer)}</div></div></div><div class="result"><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><strong>Authored baseline output</strong>${chip(p.classification,classifyTone(p.classification))}${chip(p.priority)}</div><p>${esc('This demonstration predicts '+nice(p.classification)+'. It is a manually authored sample result, not a generated or verified AI conclusion.')}</p><p><b>Evidence quote:</b> ${p.quote?`“${esc(p.quote)}”`:'Not supplied'}</p><p><b>Exact quote appears in source?</b> ${p.quote?(s.excerpt.includes(p.quote)?'Yes':'No · evidence invalid'):(p.classification==='insufficient_evidence'?'Not required':'No · evidence missing')}</p></div><div><h3>Deterministic checks</h3>${[['Linked source',!!s],['Reference version',!!s.version],['Assigned owner',!!selected.owner],['Provided source text',!!s.excerpt]].map(([a,b])=>`<p class="small" style="margin:7px 0">${b?'✓':'×'} ${esc(a)}</p>`).join('')}</div><div style="margin-top:17px"><h3>Applicable fictional policies</h3><p class="small">${policies.map(x=>esc(x.id)).join(', ')}</p></div><div class="decisionline"><b>Human reviewer:</b> ${decision?chip(decision,'green'):chip('Pending','amber')}<button class="btn" data-decision="confirmed">Confirm flag</button><button class="btn" data-decision="dismissed">Dismiss</button><button class="btn" data-decision="investigate">Investigate</button></div><div class="footnote">The expected label used for evaluation is deliberately hidden here; reveal it in the Evaluation lab.</div></section></div>`}
function impactMatches(update){return CASES.map(c=>{let linked=c.sourceId===update.sourceId,terms=update.changedTerms.filter(t=>(c.title+' '+c.content).toLowerCase().includes(t.toLowerCase()));return linked||terms.length>=2?{c,linked,terms}:null}).filter(Boolean).sort((a,b)=>Number(b.linked)-Number(a.linked))}
function renderImpact(){let u=getUpdate(state.update),m=impactMatches(u),linked=m.filter(x=>x.linked).length;return `${title('Workflow 02 / reference version changes','Portfolio impact map','When a reference document changes, locate explicit source dependencies and weaker keyword candidates for human review.')}<div class="columns"><section class="panel"><div class="paneltitle"><div><h2>Incoming source updates</h2><p>Select a version change</p></div></div><div class="updateList">${UPDATES.map(x=>`<button class="updateitem ${x.id===u.id?'selected':''}" data-update="${x.id}"><span>${x.id} · ${x.sector} · ${x.date}</span><strong>${esc(x.title)}</strong><span>${esc(x.previousVersion)} → ${esc(x.updatedVersion)}</span></button>`).join('')}</div></section><section class="panel"><div class="paneltitle"><div><h2>${esc(u.title)}</h2><p>${esc(u.sourceId)} · version ${esc(u.previousVersion)} → ${esc(u.updatedVersion)}</p></div>${chip(u.sector)}</div><div class="compare"><div class="impactcard"><b>PREVIOUS REFERENCE</b><p>${esc(u.previousText)}</p></div><div class="impactcard"><b>UPDATED REFERENCE</b><p>${esc(u.updatedText)}</p></div></div><div class="stats" style="grid-template-columns:repeat(2,1fr)"><div class="stat"><label>Source-linked dependencies</label><strong>${linked}</strong></div><div class="stat"><label>Other keyword candidates</label><strong>${m.length-linked}</strong></div></div><h3>Potentially affected content</h3>${m.length?m.map(x=>`<div class="listitem" style="cursor:default"><div style="display:flex;align-items:center;justify-content:space-between;gap:8px"><span>${x.c.id} · ${x.c.property}</span>${chip(x.linked?'Linked source':'Keyword candidate',x.linked?'violet':'amber')}</div><strong>${esc(x.c.title)}</strong><span>${x.terms.length?'Matched terms: '+x.terms.join(', '):'Source ID dependency'}</span><div class="buttonrow" style="margin-top:10px"><button class="btn" data-case="${x.c.id}">Open review →</button><select aria-label="Impact decision for ${x.c.id}" data-impact="${u.id}:${x.c.id}" class="input" style="max-width:165px"><option value="">Not yet reviewed</option><option value="confirmed" ${state.impactDecisions[u.id+':'+x.c.id]==='confirmed'?'selected':''}>Confirmed impact</option><option value="dismissed" ${state.impactDecisions[u.id+':'+x.c.id]==='dismissed'?'selected':''}>Not impacted</option><option value="investigate" ${state.impactDecisions[u.id+':'+x.c.id]==='investigate'?'selected':''}>Needs investigation</option></select></div></div>`).join(''):'<p class="small">No candidates based on linked sources or term matching.</p>'}<div class="notice">Source links are dependencies—not confirmed factual errors. Keyword matches are weaker signals. No website crawling, semantic search, or live CMS integration occurs in this demo.</div></section></div>`}
function scoreDataset(rows){let total=rows.length,correct=rows.filter(r=>r.pred.classification===r.case.gold).length,high=rows.filter(r=>r.case.goldPriority==='high'||r.case.goldPriority==='critical'),highCaught=high.filter(r=>r.pred.priority==='high'||r.pred.priority==='critical').length,negative=rows.filter(r=>r.case.gold==='supported'),falseAlerts=negative.filter(r=>r.pred.classification!=='supported').length,insufficient=rows.filter(r=>r.case.gold==='insufficient_evidence'),abstain=insufficient.filter(r=>r.pred.classification==='insufficient_evidence').length,evidence=rows.filter(r=>{const quote=r.pred.quote,s=getSource(r.case.sourceId);return r.pred.classification==='insufficient_evidence'?!quote:Boolean(quote&&s.excerpt.includes(quote))}).length;return{total,correct,pct:total?Math.round(100*correct/total):0,highRecall:high.length?Math.round(100*highCaught/high.length):null,falseAlert:negative.length?Math.round(100*falseAlerts/negative.length):null,abstention:insufficient.length?Math.round(100*abstain/insufficient.length):null,evidence:total?Math.round(100*evidence/total):0}}
function renderEvaluation(){let rows=CASES.map(c=>({case:c,pred:state.benchmark==='baseline'?getPred(c):goldPred(c)})),sc=scoreDataset(rows);return `${title('Workflow 03 / transparent evaluation','Evaluation lab','Check whether classifications agree with synthetic gold labels, and inspect errors, evidence validity, and the cost of false alarms.')}<div class="notice">The baseline contains deliberately imperfect, hand-authored classifications; the ground-truth option shows the labeled answers for illustration. <b>Neither option executes an AI model.</b> Live LLM evaluation is available only in the separate Next.js development app when deliberately enabled.</div><div class="buttonrow"><button class="btn ${state.benchmark==='baseline'?'primary':''}" data-benchmark="baseline">Authored demo baseline</button><button class="btn ${state.benchmark==='gold'?'primary':''}" data-benchmark="gold">Gold labels (reference)</button></div><div class="stats"><div class="stat"><label>Evaluated cases</label><strong>${sc.total}</strong></div><div class="stat"><label>Label agreement</label><strong>${sc.pct}%</strong><small>${sc.correct} of ${sc.total}</small></div><div class="stat"><label>High-priority recall</label><strong>${sc.highRecall??'n/a'}%</strong></div><div class="stat"><label>Exact quote check</label><strong>${sc.evidence}%</strong></div></div><div class="panel" style="margin-top:18px"><div class="paneltitle"><div><h2>Predictions and expected outcomes</h2><p>Select an individual case to review its source and context</p></div>${chip('Synthetic benchmark')}</div><div class="tablewrap"><table><thead><tr><th>Case</th><th>Vertical</th><th>Expected</th><th>Prediction</th><th>Priority</th><th>Match</th><th>Inspect</th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>${r.case.id}</b><div class="small">${esc(r.case.title)}</div></td><td>${esc(r.case.sector)}</td><td>${chip(r.case.gold,classifyTone(r.case.gold))}</td><td>${chip(r.pred.classification,classifyTone(r.pred.classification))}</td><td>${chip(r.pred.priority)}</td><td>${r.case.gold===r.pred.classification?chip('Match','green'):chip('Mismatch','red')}</td><td><button class="btn" data-case="${r.case.id}">Review</button></td></tr>`).join('')}</tbody></table></div></div><div class="two"><div class="panel"><h2>False-positive rate</h2><p style="font-size:26px;font-weight:800;margin:10px 0">${sc.falseAlert??'n/a'}%</p><p class="small">Proportion of known supported claims unnecessarily flagged.</p></div><div class="panel"><h2>Insufficient-evidence recall</h2><p style="font-size:26px;font-weight:800;margin:10px 0">${sc.abstention??'n/a'}%</p><p class="small">Proportion of cases labeled insufficient evidence that the baseline classified accordingly.</p></div></div>`}
function renderPolicies(){return `${title('Governance / policy rules','Policy library','Fictional editorial governance rules used to illustrate independent validation and human oversight.') }<div class="notice">These are invented policies for the prototype—not actual rules of Internet Brands, Medscape, WebMD, or any other company.</div><div class="policygrid">${POLICIES.map(p=>`<div class="policycard"><div class="buttonrow">${chip(p.id,'muted')}${chip(p.sector,p.sector==='All'?'muted':'violet')}</div><strong>${esc(p.title)}</strong><p>${esc(p.requirement)}</p><div class="footnote"><b>Rationale:</b> ${esc(p.rationale)}</div></div>`).join('')}</div>`}
function render(){renderNav();$('#workspace').innerHTML=({overview:renderOverview,review:renderReview,impact:renderImpact,evaluation:renderEvaluation,policies:renderPolicies})[state.tab]();}
// Delegate clicks so newly rendered screens remain interactive.
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;
 if(b.dataset.nav){navigate(b.dataset.nav);return}
 if(b.dataset.openSector){state.sector=b.dataset.openSector;navigate('review');return}
 if(b.dataset.case){state.selected=b.dataset.case;navigate('review');return}
 if(b.dataset.sector){state.sector=b.dataset.sector;render();return}
 if(b.dataset.update){state.update=b.dataset.update;render();return}
 if(b.dataset.benchmark){state.benchmark=b.dataset.benchmark;render();return}
 if(b.dataset.decision){state.decisions[state.selected]=b.dataset.decision;try{localStorage.setItem('cs-decisions',JSON.stringify(state.decisions))}catch{};render();return}
});
document.addEventListener('input',e=>{if(e.target.id==='caseSearch'){const input=e.target;state.query=input.value;const a=input.selectionStart;render();const next=$('#caseSearch');next.focus();next.setSelectionRange(a,a)}});
document.addEventListener('change',e=>{if(e.target.dataset.impact){state.impactDecisions[e.target.dataset.impact]=e.target.value}});
render();
</script></body></html>
